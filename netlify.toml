[build]
  base = "."
  command = "pnpm install --no-frozen-lockfile && pnpm --filter @workspace/portfolio run build"
  publish = "artifacts/portfolio/dist/public"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10"

# ============================================================
# Redirects
# ============================================================
# SPA fallback. Unknown paths still render the app shell (so the
# React NotFound page shows up) but return a real HTTP 404 instead
# of 200, so search engines do not index them as soft 404s.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

# ============================================================
# Security headers
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://formsubmit.co; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://i.ibb.co; connect-src 'self' https://formsubmit.co; manifest-src 'self'; upgrade-insecure-requests"

# ============================================================
# Caching
# ============================================================
# Hashed build assets never change -> cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML must always be revalidated so new deploys are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"
